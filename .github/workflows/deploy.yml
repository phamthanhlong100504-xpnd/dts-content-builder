name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/content-builder
  DEPLOY_DIR: /dts/content-builder

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      # Gradle:
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Tests & Build
        run: |
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx512m"
          chmod +x gradlew && ./gradlew clean test bootJar

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "build/test-results/**/*.xml"

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-test-report
          path: build/reports/tests/test/
          retention-days: 7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Deploy VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p ${{ env.DEPLOY_DIR }}
            cd ${{ env.DEPLOY_DIR }}
            cat << 'EOF' > docker-compose.yml
            services:
              content-builder:
                image: ${{ env.IMAGE }}:latest
                container_name: content-builder
                restart: unless-stopped
                ports: ["8082:8082"]
                mem_limit: 224m
                environment:
                  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx128m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss512k"
                  EUREKA_URI: "http://eureka-server:8761/eureka/"
                logging:
                  driver: "json-file"
                  options:
                    max-size: "20m"
                    max-file: "3"
                networks: [dts-network]

            networks:
              dts-network: { external: true }
            EOF
            docker network create dts-network || true
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -a -f

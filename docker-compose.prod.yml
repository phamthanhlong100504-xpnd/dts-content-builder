services:
  content-builder:
    image: ghcr.io/phamthanhlong100504-xpnd/content-builder:latest
    container_name: content-builder
    restart: unless-stopped
    ports: ["8082:8082"]
    mem_limit: 150m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m -XX:+UseContainerSupport"
    networks: [dts-network]

networks:
  dts-network: { external: true }
